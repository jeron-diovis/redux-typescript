extends:
  - ./base.yml
  - ./typescript.yml
  - ./react.yml
  - ./jsx-control-statements.yml
  - ./imports.yml
  - ./prettier.yml

overrides:
  # infrastructure scripts/configs
  - files:
      - '!src/**'
    rules:
      '@typescript-eslint/no-var-requires': off
      react-hooks/rules-of-hooks: off
      no-console: off

  - files:
      - 'src/**/*.test.*'
    rules:
      no-console: off

  - files:
      - '**/*.js'
    rules:
      no-undef: error
